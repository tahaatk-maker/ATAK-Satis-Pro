<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Kart dışa aktarma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@800&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/cards.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #fff;
      }
      .page, .hero, .toolbar { display: none !important; }
      #shot {
        width: 90mm;
        height: 50mm;
        margin: 0;
      }
      #shot .stage {
        transform: none;
        margin: 0;
      }
      .card {
        box-shadow: none;
        border-radius: 0;
      }
    </style>
  </head>
  <body>
    <div id="shot"></div>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="icon-mobile" viewBox="0 0 24 24">
        <rect x="7" y="3" width="10" height="18" rx="2"></rect>
        <path d="M11 18h2"></path>
      </symbol>
      <symbol id="icon-mail" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="M4 7l8 6 8-6"></path>
      </symbol>
      <symbol id="icon-phone" viewBox="0 0 24 24">
        <path
          d="M7 3h3l1.5 4-2 1.5a12 12 0 0 0 6 6L17 13l4 1.5V18a2 2 0 0 1-2 2A16 16 0 0 1 5 6a2 2 0 0 1 2-3z"
        ></path>
      </symbol>
      <symbol id="icon-pin" viewBox="0 0 24 24">
        <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"></path>
        <circle cx="12" cy="10" r="2.2"></circle>
      </symbol>
    </svg>
    <script type="module">
      import { SELLERS, isComplete } from "./js/sellers.js";
      import { frontCardHTML, backCardHTML } from "./js/render.js";
      const params = new URLSearchParams(location.search);
      const id = Number(params.get("id") || "1");
      const side = params.get("side") || "front";
      const seller = SELLERS.find((s) => s.id === id) || SELLERS[0];
      const complete = isComplete(seller);
      document.getElementById("shot").innerHTML =
        `<div class="stage">${side === "back" ? backCardHTML(seller, complete) : frontCardHTML(seller, complete)}</div>`;
    </script>
  </body>
</html>
