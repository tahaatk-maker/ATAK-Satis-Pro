<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atak Pazarlama · Yeni Şifre</title>
<link rel="icon" href="/assets/favicon.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#062f65,#0c66b5);color:#13233b;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(430px,100%);background:#fff;padding:32px;border-radius:22px;display:grid;gap:13px;box-shadow:0 24px 70px #001e3f66}
img{width:min(280px,100%);height:160px;object-fit:contain;margin:auto;display:block}
h1,p{margin:0;text-align:center}
p{color:#69778e;line-height:1.45}
input,button{height:50px;border-radius:11px;font:inherit}
input{border:1px solid #d8e0eb;padding:0 14px}
button{border:0;background:#075eae;color:#fff;font-weight:800;cursor:pointer}
.links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.links a{color:#075eae;font-weight:700;text-decoration:none}
.status{text-align:center;min-height:18px;font-weight:700}
.status.err{color:#b32626}
.status.ok{color:#15803d}
</style>
</head>
<body>
<form class="card" id="resetForm">
  <img src="/assets/atak-pazarlama-full.png?v=logo5" alt="Atak Pazarlama">
  <h1>Yeni Şifre</h1>
  <p id="hint">Maildeki sıfırlama linki ile geldiniz. Yeni şifrenizi yazın (en az 6 karakter).</p>
  <input id="p1" type="password" autocomplete="new-password" placeholder="Yeni şifre" required minlength="6">
  <input id="p2" type="password" autocomplete="new-password" placeholder="Yeni şifre (tekrar)" required minlength="6">
  <button type="submit">Şifreyi Kaydet</button>
  <div class="status" id="st"></div>
  <div class="links">
    <a href="/personel">Personel girişi</a>
    <a href="/web-admin">Yönetim girişi</a>
  </div>
</form>
<script>
(function(){
  function tokenFromUrl(){
    try{
      const q=new URLSearchParams(location.search).get('reset');
      if(q)return q;
      const h=String(location.hash||'').replace(/^#/,'');
      if(h.indexOf('reset=')===0)return decodeURIComponent(h.slice(6));
      if(/^[a-f0-9]{64}$/i.test(h))return h;
    }catch(_){}
    return '';
  }
  const token=tokenFromUrl();
  const st=document.getElementById('st');
  const form=document.getElementById('resetForm');
  fetch('/foundation-api/logout',{method:'POST',credentials:'same-origin'}).catch(function(){});
  if(!token){
    st.className='status err';
    st.textContent='Linkte sıfırlama kodu yok. Personel girişinden “Şifremi unuttum” ile yeni mail isteyin.';
    form.querySelectorAll('input,button[type=submit]').forEach(function(el){el.disabled=true});
    return;
  }
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    st.className='status';st.textContent='';
    const p1=document.getElementById('p1').value||'';
    const p2=document.getElementById('p2').value||'';
    if(p1!==p2){st.className='status err';st.textContent='Şifreler uyuşmuyor';return}
    if(p1.length<6){st.className='status err';st.textContent='Yeni şifre en az 6 karakter olmalı';return}
    try{
      const r=await fetch('/web-api/reset-password',{
        method:'POST',credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:token,password:p1})
      });
      const d=await r.json().catch(function(){return {}});
      if(!r.ok)throw new Error(d.error||d.message||'Şifre güncellenemedi');
      st.className='status ok';
      st.textContent=d.message||'Şifre güncellendi. Giriş yapabilirsiniz.';
      document.getElementById('hint').textContent='Şifreniz kaydedildi. Personel veya yönetim girişine dönün.';
      form.querySelectorAll('input,button[type=submit]').forEach(function(el){el.disabled=true});
    }catch(err){
      st.className='status err';
      st.textContent=err.message||'Şifre güncellenemedi';
    }
  });
})();
</script>
</body>
</html>
