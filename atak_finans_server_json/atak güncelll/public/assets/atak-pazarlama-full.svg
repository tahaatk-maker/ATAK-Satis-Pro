  </g>

  <line x1="360" y1="348" x2="360" y2="420" stroke="#d7e1ee" stroke-width="2"/>

  <g transform="translate(392 352)">
    <path d="M6 16 C26 6,48 26,68 16" fill="none" stroke="#f0b429" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M6 29 C26 19,48 39,68 29" fill="none" stroke="#f0b429" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M6 42 C26 32,48 52,68 42" fill="none" stroke="#f0b429" stroke-width="4.2" stroke-linecap="round"/>
    <text x="170" y="40" text-anchor="middle"
