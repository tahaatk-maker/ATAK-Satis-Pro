<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-label="Atak Pazarlama">
  <defs>
    <linearGradient id="atakBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b76cc"/>
      <stop offset="100%" stop-color="#0a4d94"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0a4d94" flood-opacity=".16"/>
    </filter>
  </defs>

  <g transform="translate(288 18)" filter="url(#soft)">
    <path fill="url(#atakBlue)" fill-rule="evenodd" d="
