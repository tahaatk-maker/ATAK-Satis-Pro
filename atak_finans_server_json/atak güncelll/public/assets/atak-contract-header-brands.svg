<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 150" role="img" aria-label="ATAK · Beko · ?stikbal">
  <rect width="980" height="150" fill="#ffffff"/>
  <defs>
    <linearGradient id="atakBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b76cc"/>
      <stop offset="100%" stop-color="#0a4d94"/>
    </linearGradient>
  </defs>

  <!-- ATAK: A + ATAK / PAZARLAMA (yatay) -->
  <g transform="translate(10 12)">
    <path fill="url(#atakBlue)" fill-rule="evenodd" d="
      M54 4
      L112 126 H84
      L71.5 98 H36.5
      L24 126 H-4
      L54 4 Z
      M54 36
      L68 66 H40 Z
    "/>
    <!-- sol bacak iç bayrak -->
    <rect x="28" y="52" width="24" height="11" rx="1" fill="url(#atakBlue)"/>
    <text x="132" y="62"
          font-family="Montserrat, 'Arial Black', Arial, Helvetica, sans-serif"
          font-size="46" font-weight="900" letter-spacing="6"
          fill="#0a4d94">ATAK</text>
    <text x="134" y="102"
          font-family="Montserrat, Arial, Helvetica, sans-serif"
          font-size="17" font-weight="700" letter-spacing="7.6"
          fill="#0a4d94">PAZARLAMA</text>
  </g>

  <!-- BEKO -->
  <g transform="translate(455 48)">
    <text x="0" y="36"
          font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif"
          font-size="42" font-weight="800" fill="#0057a8">beko</text>
    <!-- klasik e?ik çizgi: b alt?ndan k önüne -->
    <path d="M4 46 L98 39" stroke="#0057a8" stroke-width="5.2" stroke-linecap="round"/>
  </g>

  <!-- ISTIKBAL: sar? dalga ?eritler + italik yaz? -->
  <g transform="translate(600 44)">
    <path d="M0 8
             C10 2, 22 2, 32 8
             C42 14, 54 14, 64 8
             L64 16
             C54 22, 42 22, 32 16
             C22 10, 10 10, 0 16 Z" fill="#f0b429"/>
    <path d="M0 24
             C10 18, 22 18, 32 24
             C42 30, 54 30, 64 24
             L64 32
             C54 38, 42 38, 32 32
             C22 26, 10 26, 0 32 Z" fill="#f0b429"/>
    <path d="M0 40
             C10 34, 22 34, 32 40
             C42 46, 54 46, 64 40
             L64 48
             C54 54, 42 54, 32 48
             C22 42, 10 42, 0 48 Z" fill="#f0b429"/>
    <text x="78" y="42"
          font-family="Arial, Helvetica, sans-serif"
          font-size="36" font-style="italic" font-weight="700"
          fill="#0a4d94">istikbal</text>
  </g>
</svg>
