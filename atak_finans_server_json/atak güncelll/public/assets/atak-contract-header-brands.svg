<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 150" role="img" aria-label="ATAK · Beko · İstikbal">
  <rect width="980" height="150" fill="#ffffff"/>
  <defs>
    <linearGradient id="atakBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b76cc"/>
      <stop offset="100%" stop-color="#0a4d94"/>
    </linearGradient>
  </defs>

  <!-- ATAK -->
  <g transform="translate(10 12)">
    <path fill="url(#atakBlue)" fill-rule="evenodd" d="
      M54 4 L112 126 H84 L71.5 98 H36.5 L24 126 H-4 L54 4 Z
      M54 36 L68 66 H40 Z"/>
    <rect x="28" y="52" width="24" height="11" rx="1" fill="url(#atakBlue)"/>
    <text x="132" y="62" font-family="Montserrat, 'Arial Black', Arial, Helvetica, sans-serif"
          font-size="46" font-weight="900" letter-spacing="6" fill="#0a4d94">ATAK</text>
    <text x="134" y="102" font-family="Montserrat, Arial, Helvetica, sans-serif"
          font-size="17" font-weight="700" letter-spacing="7.6" fill="#0a4d94">PAZARLAMA</text>
  </g>

  <!-- Partners share same vertical band (y=48..120 ≈ height 72) -->
  <g transform="translate(455 48)">
    <!-- BEKO box height ~72 -->
    <text x="0" y="42" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif"
          font-size="48" font-weight="800" fill="#0057a8">beko</text>
    <path d="M4 54 L112 46" stroke="#0057a8" stroke-width="5.5" stroke-linecap="round"/>
  </g>

  <g transform="translate(600 48)">
    <!-- ISTIKBAL same band -->
    <path d="M0 8 C10 2,22 2,32 8 C42 14,54 14,64 8 L64 18 C54 24,42 24,32 18 C22 12,10 12,0 18 Z" fill="#f0b429"/>
    <path d="M0 26 C10 20,22 20,32 26 C42 32,54 32,64 26 L64 36 C54 42,42 42,32 36 C22 30,10 30,0 36 Z" fill="#f0b429"/>
    <path d="M0 44 C10 38,22 38,32 44 C42 50,54 50,64 44 L64 54 C54 60,42 60,32 54 C22 48,10 48,0 54 Z" fill="#f0b429"/>
    <text x="78" y="46" font-family="Arial, Helvetica, sans-serif"
          font-size="42" font-style="italic" font-weight="700" fill="#0a4d94">istikbal</text>
  </g>
</svg>
