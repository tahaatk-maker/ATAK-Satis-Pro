<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atak Home — Eviniz için her şey</title>
  <meta name="description" content="Atak Home Sarıyer. Beko, İstikbal, beyaz eşya, mobilya, klima ve TV.">
  <link rel="icon" href="/atak-header-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <a class="brand" href="#/" aria-label="Atak Home">
        <img src="/atak-header-logo.svg" alt="Atak Pazarlama" width="180" height="52">
      </a>
      <form class="search" id="searchForm">
        <input id="searchInput" type="search" placeholder="Buzdolabı, klima, kanepe ara" autocomplete="off">
        <button type="submit">Ara</button>
      </form>
      <div class="top-actions">
        <a class="btn btn-ghost" id="phoneBtn" href="tel:+902122232871">0212 223 28 71</a>
        <a class="btn btn-wa" id="waBtn" href="https://wa.me/905433585060" target="_blank" rel="noopener">WhatsApp</a>
        <button class="cart-btn" id="cartBtn" type="button">Sepet <b id="cartCount">0</b></button>
      </div>
    </div>
    <div class="cats-bar wrap" id="catsBar"></div>
  </header>

  <main id="app"></main>

  <aside class="drawer hidden" id="cartDrawer" aria-label="Sepet">
    <div class="drawer-bg" id="cartClose"></div>
    <div class="drawer-box">
      <div class="drawer-head">
        <h2>Sepet</h2>
        <button type="button" id="cartX">Kapat</button>
      </div>
      <div id="cartItems"></div>
      <div class="drawer-foot">
        <p>Toplam <b id="cartTotal">0 TL</b></p>
        <a class="btn btn-primary wide" id="cartWa" href="#" target="_blank" rel="noopener">WhatsApp ile sipariş</a>
        <p class="tiny">Ödeme ve teslimat mağazada netleşir.</p>
      </div>
    </div>
  </aside>

  <footer class="foot">
    <div class="wrap">
      <p><strong>ATAK EV GEREÇLERİ PAZ. TİC. LTD. ŞTİ.</strong></p>
      <p id="footAddr">Ferahevler Mah. Adnan Kahveci Cad. No:109 Sarıyer / İstanbul</p>
    </div>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
